[package]
name = "centuria-saf"
version = "1.1.0"
authors = ["Argo"]
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
dashmap = "5.5"
chrono = "0.4"
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.5"
arc-swap = "1.6" 
notify = "6.1"
governor = "0.6"
nonzero_ext = "0.3"
# future web gui
reqwest = { version = "0.11", features = ["json"] }

