[package]
name = "centuria-saf"
version = "1.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
arc-swap = "1.6.0"
dashmap = "5.5.0"
chrono = "0.4.31"
colored = "2.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8.8"
notify = "6.1.1"
governor = "0.6.0"
reqwest = { version = "0.11", features = ["json"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
